<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" role="img" aria-label="CoderDojo 太極図マーク">
  <!-- CoderDojo 公式 太極図（yin-yang）マーク -->
  <!-- 京紫の背景（陽） -->
  <circle cx="18" cy="18" r="17.5" fill="#5B3070"/>
  <!-- 生成り領域（陰）：上の小半円＋下の小半円＋左の大半円 -->
  <path d="M18,0.5 A9,9,0,0,1,18,18 A9,9,0,0,0,18,35.5 A17.5,17.5,0,0,0,18,0.5 Z" fill="#F5F0E8"/>
  <!-- 陽の中の陰（小さい京紫丸） -->
  <circle cx="18" cy="9" r="4.5" fill="#5B3070"/>
  <!-- 陰の中の陽（小さい生成り丸） -->
  <circle cx="18" cy="27" r="4.5" fill="#F5F0E8"/>
  <!-- 縁取り -->
  <circle cx="18" cy="18" r="17.5" fill="none" stroke="#F5F0E8" stroke-width="1"/>
  <!-- 陽エリア（京紫）の「四」 -->
  <text x="18" y="13" text-anchor="middle" dominant-baseline="middle"
        font-family="serif" font-size="9" font-weight="bold" fill="#F5F0E8">四</text>
  <!-- 陰エリア（生成り）の「条」 -->
  <text x="18" y="28" text-anchor="middle" dominant-baseline="middle"
        font-family="serif" font-size="9" font-weight="bold" fill="#5B3070">条</text>
</svg>
