<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="プログラミングをイメージしたイラスト">
  <defs>
    <linearGradient id="blockA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F39A4B"/>
      <stop offset="100%" stop-color="#D87E2C"/>
    </linearGradient>
    <linearGradient id="blockB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E6EAF2" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blockC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7FB1E0"/>
      <stop offset="100%" stop-color="#4F8BC4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- 背景の柔らかいぼかし円（雰囲気だけ） -->
  <circle cx="120" cy="80"  r="80" fill="#F39A4B" opacity="0.18" filter="url(#soft)"/>
  <circle cx="380" cy="280" r="90" fill="#7FB1E0" opacity="0.18" filter="url(#soft)"/>

  <!-- ノートPC -->
  <g transform="translate(110,150)">
    <!-- 画面 -->
    <rect x="0" y="0" width="260" height="155" rx="10" ry="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/>
    <rect x="10" y="10" width="240" height="135" rx="4" ry="4" fill="#142944"/>
    <!-- コード行 -->
    <g fill="#7FB1E0">
      <rect x="22" y="24" width="90"  height="6" rx="3"/>
      <rect x="22" y="40" width="140" height="6" rx="3"/>
      <rect x="22" y="56" width="110" height="6" rx="3"/>
      <rect x="22" y="72" width="160" height="6" rx="3"/>
      <rect x="22" y="88" width="80"  height="6" rx="3"/>
      <rect x="22" y="104" width="130" height="6" rx="3"/>
    </g>
    <g fill="#F39A4B">
      <rect x="116" y="24" width="40" height="6" rx="3"/>
      <rect x="166" y="40" width="46" height="6" rx="3"/>
      <rect x="136" y="56" width="58" height="6" rx="3"/>
      <rect x="186" y="72" width="36" height="6" rx="3"/>
      <rect x="106" y="88" width="80" height="6" rx="3"/>
    </g>
    <!-- カーソル -->
    <rect x="156" y="104" width="2" height="8" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <!-- キーボード台 -->
    <path d="M -20 158 L 280 158 L 270 175 L -10 175 Z" fill="#E6EAF2" stroke="#1F3A5F" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- 浮かぶブロック1（Scratch風） 上 -->
  <g transform="translate(36,40) rotate(-6)">
    <rect width="120" height="36" rx="8" ry="8" fill="url(#blockA)"/>
    <text x="14" y="23" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">when ▶ clicked</text>
  </g>

  <!-- 浮かぶブロック2 右上 -->
  <g transform="translate(330,30) rotate(5)">
    <rect width="120" height="36" rx="8" ry="8" fill="url(#blockC)"/>
    <text x="14" y="23" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">move 10 steps</text>
  </g>

  <!-- 浮かぶブロック3 左下 -->
  <g transform="translate(20,290) rotate(4)">
    <rect width="140" height="36" rx="8" ry="8" fill="url(#blockB)"/>
    <text x="14" y="23" font-family="sans-serif" font-size="14" font-weight="700" fill="#1F3A5F">repeat 4 ▾</text>
  </g>

  <!-- 浮かぶブロック4 右下 -->
  <g transform="translate(330,300) rotate(-4)">
    <rect width="110" height="36" rx="8" ry="8" fill="url(#blockA)"/>
    <text x="14" y="23" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">say "Hi"</text>
  </g>

  <!-- スパークル -->
  <g fill="#FFFFFF">
    <circle cx="60"  cy="180" r="2.5" opacity="0.7"/>
    <circle cx="430" cy="150" r="3"   opacity="0.8"/>
    <circle cx="450" cy="220" r="2"   opacity="0.6"/>
    <circle cx="200" cy="50"  r="2"   opacity="0.6"/>
  </g>
  <g fill="#F39A4B">
    <circle cx="90"  cy="120" r="3"/>
    <circle cx="410" cy="100" r="2.5"/>
    <circle cx="240" cy="340" r="3"/>
  </g>
</svg>
