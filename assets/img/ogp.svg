<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="CoderDojo 京都四条 OGP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F3A5F"/>
      <stop offset="100%" stop-color="#0F2340"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.18" r="0.6">
      <stop offset="0%"  stop-color="#F39A4B" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#F39A4B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A4A75"/>
      <stop offset="100%" stop-color="#142944"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- 装飾ドット -->
  <g fill="#F39A4B">
    <circle cx="90"   cy="540" r="5"  opacity="0.7"/>
    <circle cx="1100" cy="100" r="6"  opacity="0.9"/>
    <circle cx="1050" cy="540" r="4"  opacity="0.6"/>
    <circle cx="60"   cy="120" r="4"  opacity="0.7"/>
  </g>
  <g fill="#7FB1E0">
    <circle cx="170" cy="80"  r="3" opacity="0.6"/>
    <circle cx="980" cy="60"  r="3" opacity="0.6"/>
    <circle cx="220" cy="520" r="3" opacity="0.6"/>
  </g>

  <!-- ロゴマーク（大きめ） -->
  <g transform="translate(96,196)">
    <rect x="0" y="0" width="220" height="220" rx="40" ry="40" fill="url(#markG)"/>
    <g stroke="#F39A4B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
      <path d="M 40 60 L 22 110 L 40 160"/>
      <path d="M 180 60 L 198 110 L 180 160"/>
    </g>
    <text x="110" y="148" text-anchor="middle"
          font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif"
          font-size="100" font-weight="700" fill="#ffffff">忍</text>
    <circle cx="172" cy="46" r="11" fill="#F39A4B"/>
  </g>

  <!-- テキスト -->
  <g font-family="'Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo',sans-serif" fill="#ffffff">
    <text x="356" y="262" font-size="42" font-weight="600" opacity="0.85">CoderDojo</text>
    <text x="356" y="362" font-size="100" font-weight="800">京都四条</text>
    <text x="356" y="430" font-size="30" font-weight="500" fill="#FFD6A8">
      京都市下京区の子ども向けプログラミング道場
    </text>
    <text x="356" y="478" font-size="22" font-weight="400" opacity="0.78">
      Scratch / micro:bit / Web / Python など、自分のペースで「つくる」を学べます。
    </text>
  </g>

  <!-- 下部のサイトURLバー -->
  <rect x="96" y="540" width="1008" height="2" fill="#F39A4B" opacity="0.4"/>
  <text x="96" y="580" font-family="sans-serif" font-size="22" fill="#FFD6A8" font-weight="600">
    coderdojo-kyoto-shijo.github.io
  </text>
  <text x="1104" y="580" font-family="sans-serif" font-size="20" fill="#cfd9e6" text-anchor="end">
    7〜17歳・参加無料・月1回 日曜午後
  </text>
</svg>
